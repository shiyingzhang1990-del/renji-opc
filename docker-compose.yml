services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: renji
      POSTGRES_USER: renji
      POSTGRES_PASSWORD: renji_dev_password
    ports:
      - "5432:5432"
    volumes:
      - renji_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renji -d renji"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_NAME: 壬集 OPC
      ENV: development
      DATABASE_URL: postgresql+psycopg://renji:renji_dev_password@db:5432/renji
      PLATFORM_FEE_RATE: "0.08"
      CORS_ORIGINS: http://localhost:5173
      PAYMENT_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  renji_pgdata:
